services:
  - type: web
    name: discord-gemini-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /api/status
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GEMINI_KEYS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AUTO_REPLY_CHANNEL_IDS
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: LAVALINK_HOST
        value: https://discord-lavalink.onrender.com
      - key: LAVALINK_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: web
    name: discord-lavalink
    runtime: docker
    dockerfilePath: ./lavalink/Dockerfile
    envVars:
      - key: LAVALINK_PASSWORD
        sync: false
